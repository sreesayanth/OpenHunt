[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openhunt"
version = "0.1.0"
description = "Self-hosted AI job hunter you control from Telegram"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot[job-queue]>=22.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "cryptography>=42",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "qrcode>=7.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# LinkedIn / Indeed / Glassdoor / Naukri search. Heavy (pandas), so optional for Android/Termux.
boards = ["python-jobspy>=1.4"]
# The hidden browser for logging in and applying. Downloaded automatically the first time you connect
# a job site, so installing it up front is optional. Not available on Android/Termux.
apply = ["playwright>=1.49"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
openhunt = "openhunt.cli:main"

[tool.setuptools.packages.find]
include = ["openhunt*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
