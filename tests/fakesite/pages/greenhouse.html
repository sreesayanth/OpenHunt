<html><head><title>Job Application for Data Analyst at Acme</title></head><body>
<div id="app_body">
<h1 class="app-title">Data Analyst</h1><span class="company-name">at Acme</span>
<div id="content"><p>We are hiring a Data Analyst with SQL and Python.</p></div>
<form id="application_form" action="/submit/greenhouse" method="post" enctype="multipart/form-data">
<div id="main_fields">
  <div class="field"><label for="first_name">First Name <span class="asterisk">*</span></label><input type="text" id="first_name" name="first_name" aria-required="true"></div>
  <div class="field"><label for="last_name">Last Name <span class="asterisk">*</span></label><input type="text" id="last_name" name="last_name" aria-required="true"></div>
  <div class="field"><label for="email">Email <span class="asterisk">*</span></label><input type="text" id="email" name="email" aria-required="true"></div>
  <div class="field"><label for="phone">Phone</label><input type="text" id="phone" name="phone"></div>
  <div class="field" id="resume_fieldset"><label>Resume/CV <span class="asterisk">*</span></label>
    <div class="attach-or-paste"><input type="file" id="resume" name="resume" style="display:none"><button type="button" onclick="document.getElementById('resume').click()">Attach</button></div></div>
</div>
<div id="custom_fields">
  <div class="field"><label>LinkedIn Profile <input type="text" name="q_linkedin"></label></div>
  <div class="field"><label>How many years of experience do you have with SQL? <span class="asterisk">*</span>
    <select name="q_sql_years"><option value="">--</option><option>0-1</option><option>2-4</option><option>5+</option></select></label></div>
  <div class="field"><label for="q_auth">Are you legally authorized to work in India? <span class="asterisk">*</span></label>
    <select id="q_auth" name="q_auth"><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div class="field"><label for="q_why">Why do you want to work at Acme? <span class="asterisk">*</span></label><textarea id="q_why" name="q_why"></textarea></div>
  <div class="field"><label for="q_license">Do you have a valid driver's license? <span class="asterisk">*</span></label>
    <select id="q_license" name="q_license"><option value="">--</option><option>Yes</option><option>No</option></select></div>
</div>
<div id="eeoc_fields"><h4>U.S. Equal Employment Opportunity information</h4>
  <div class="field"><label for="gender">Gender</label><select id="gender" name="gender"><option value="">Please select</option><option>Male</option><option>Female</option><option>Decline To Self Identify</option></select></div>
</div>
<button type="submit" id="submit_app">Submit Application</button>
</form></div></body></html>
